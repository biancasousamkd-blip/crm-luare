<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Portaria · LUARE EVENTOS</title>
<meta name="theme-color" content="#1B2A4A">
<style>
:root{
  --navy:#1B2A4A; --gold:#C6A15B; --cream:#FBF7F0; --ink:#1F2430;
  --muted:#6B7280; --line:#E5E0D6; --ok:#2E7D5B; --bad:#B3453B; --warn:#B5762A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--cream); color:var(--ink);
  padding-bottom:calc(62px + env(safe-area-inset-bottom));
}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:12px 16px;display:flex;align-items:center;gap:10px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.topbar .t{flex:1;min-width:0}
.topbar .m{font-family:Georgia,serif;font-size:10px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase}
.topbar .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:36px;border-radius:10px;
  font-size:16px;cursor:pointer;flex:none;
}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 26px}
.card{
  background:#fff;border-radius:16px;padding:16px;margin:0 0 12px;
  box-shadow:0 1px 3px rgba(27,42,74,.05),0 8px 22px rgba(27,42,74,.05);
  border:1px solid rgba(198,161,91,.14);
}
.card h3{
  margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;
}
.card h3 .badge{background:var(--cream);color:var(--navy);border-radius:20px;padding:2px 8px;font-size:11px;letter-spacing:0}
h1{font-family:Georgia,serif;font-size:22px;color:var(--navy);margin:0 0 4px;font-weight:400}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
.btn{
  display:block;width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;
  font-weight:600;font-family:inherit;cursor:pointer;
}
.btn:active{transform:scale(.99)}
.btn.p{background:var(--navy);color:#fff}
.btn.g{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:1.5px solid rgba(179,69,59,.3)}
.btn.sm{padding:10px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.space{height:10px}
.campo{margin:0 0 12px}
.campo label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select,textarea{
  width:100%;padding:12px;font-size:15px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;background:#fff;
}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold)}
.item{
  display:flex;align-items:center;gap:11px;padding:12px 0;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.item:last-child{border-bottom:0}
.item .av{
  width:38px;height:38px;border-radius:50%;background:var(--cream);color:var(--navy);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;
}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--muted)}
.item .vl{font-size:13px;font-weight:700;color:var(--navy);flex:none}
.tg{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.03em}
.tg.ok{background:#E4F2EA;color:#1F5C43}
.tg.w{background:#FBF1E2;color:#8A5A18}
.tg.b{background:#FBEDEB;color:#8E3730}
.tg.n{background:#EEF0F4;color:#5A6272}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.kpi{background:#fff;border-radius:13px;padding:13px;border:1px solid rgba(198,161,91,.14)}
.kpi .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.kpi .v{font-family:Georgia,serif;font-size:23px;color:var(--navy);line-height:1}
.kpi .s{font-size:11px;color:var(--muted);margin-top:3px}
.leitor{
  position:fixed;inset:0;z-index:60;background:#0C1220;
  display:flex;flex-direction:column;
}
.leitor video{flex:1;width:100%;object-fit:cover;background:#000}
.leitor .mira{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(66vw,260px);aspect-ratio:1;border:2px solid rgba(198,161,91,.85);
  border-radius:22px;box-shadow:0 0 0 100vmax rgba(12,18,32,.55);
}
.leitor .bar{
  padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));
  background:#0C1220;color:#fff;text-align:center;
}
.leitor .bar p{margin:0 0 12px;font-size:13.5px;color:#B9C2D4}
.resultado{
  position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  justify-content:center;padding:26px;text-align:center;
}
.resultado.ok{background:#1B7A55;color:#fff}
.resultado.bad{background:#A93B31;color:#fff}
.resultado.warn{background:#B5762A;color:#fff}
.resultado h2{font-family:Georgia,serif;font-size:27px;margin:0 0 8px;font-weight:400}
.resultado .nome{font-size:21px;font-weight:700;margin:6px 0 14px;line-height:1.3}
.resultado .det{font-size:15px;opacity:.92;line-height:1.7;margin:0 0 6px}
.resultado .mesa-big{
  font-family:Georgia,serif;font-size:46px;margin:14px 0 4px;line-height:1;
}
.resultado .mesa-l{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.resultado .acoes{margin-top:26px}
.resultado .acoes button{
  background:rgba(255,255,255,.16);border:0;color:#fff;padding:15px;border-radius:12px;
  font-size:15px;font-weight:600;font-family:inherit;width:100%;cursor:pointer;
}
.nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;background:0;border:0;padding:9px 4px 11px;font-family:inherit;font-size:10.5px;
  color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.nav button.on{color:var(--navy);font-weight:700}
.nav button .ic{font-size:17px;line-height:1}
.vazio{text-align:center;padding:34px 16px;color:var(--muted);font-size:13.5px;line-height:1.6}
.oculto{display:none!important}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:g .8s linear infinite;margin:34px auto}
@keyframes g{to{transform:rotate(360deg)}}
.sync{
  position:fixed;top:0;left:0;right:0;z-index:50;background:var(--warn);color:#fff;
  font-size:12px;padding:6px;text-align:center;font-weight:600;
}
</style>
</head>

<script>

/* Endereço público da página do convidado — troque quando publicar */
const BASE_CONVIDADO = location.origin + location.pathname.replace(/portaria\.html?$/, '') + 'index.html';

let S = { pin:null, nome:null, papel:null };
let TELA = 'checkin';
let EV_SEL = null;       // evento aberto no check-in
let CACHE = {};          // { eventoId: { convidados:[...], evento:{...}, ts } }
let syncTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function rpc(fn, corpo){
  return fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },

function dataBR(iso){
  if(!iso) return '';
  const [a,m,d] = String(iso).slice(0,10).split('-');
  return d+'/'+m+'/'+a;
}
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
function diaAbrev(iso){
  if(!iso) return '';
  const p = String(iso).slice(0,10).split('-');
  return DIAS[new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function toast(msg, tipo){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:99;' +
    'background:' + (tipo==='erro' ? '#A93B31' : '#1B2A4A') + ';color:#fff;padding:12px 18px;' +
    'border-radius:11px;font-size:13.5px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}
function salvarCache(){ try{ localStorage.setItem(LS_CACHE, JSON.stringify(CACHE)); }catch(e){} }
function carregarCache(){ try{ CACHE = JSON.parse(localStorage.getItem(LS_CACHE) || '{}'); }catch(e){ CACHE = {}; } }

/* ============================================================
   LOGIN
   ============================================================ */
function telaLogin(){
  $('#topo').classList.add('oculto');
  $('#nav').classList.add('oculto');
  $('#corpo').innerHTML =
    '<div style="text-align:center;padding:38px 0 26px">' +
      '<div style="font-family:Georgia,serif;font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase">Luare Eventos</div>' +
      '<div style="width:40px;height:1px;background:var(--gold);margin:14px auto"></div>' +
      '<h1 style="font-family:Georgia,serif;font-size:23px;color:var(--navy);margin:0">Portaria</h1>' +
      '<p class="sub" style="margin-top:8px">Confirmação de presença e check-in</p>' +
    '</div>' +
    '<div class="card">' +
      '<div class="campo"><label>PIN de acesso</label>' +
      '<input id="pin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••" ' +
      'style="text-align:center;font-size:26px;letter-spacing:.4em;padding:16px" autocomplete="off"></div>' +
      '<button class="btn p" onclick="entrar()">Entrar</button>' +
      '<div class="space"></div>' +
      '<p class="sub" style="margin:0;text-align:center;font-size:12px">Acesso restrito à equipe da Luare.</p>' +
    '</div>';
  const i = $('#pin');
  i.focus();
  i.addEventListener('keydown', e => { if(e.key === 'Enter') entrar(); });
}

function entrar(){
  const pin = ($('#pin').value || '').trim();
  if (!pin){ toast('Digite o PIN.', 'erro'); return; }
  $('#corpo').innerHTML = '<div class="spin"></div>';
  rpc('conv_login', { p_pin: pin }).then(r => {
    if (!r || !r.ok){ telaLogin(); toast((r && r.erro) || 'PIN incorreto.', 'erro'); return; }
    S = { pin: pin, nome: r.nome, papel: r.papel };
    try{ localStorage.setItem(LS_PIN, pin); }catch(e){}
    iniciar();
  }).catch(() => { telaLogin(); toast('Sem conexão.', 'erro'); });
}

function sair(){
  try{ localStorage.removeItem(LS_PIN); }catch(e){}
  S = { pin:null }; CACHE = {}; EV_SEL = null;
  telaLogin();
}

/* ============================================================
   NAVEGAÇÃO
   ============================================================ */
function iniciar(){
  $('#topo').classList.remove('oculto');
  $('#topNome').textContent = S.nome + (S.papel === 'admin' ? ' · admin' : ' · portaria');
  montarNav();
  ir(TELA === 'eventos' && S.papel !== 'admin' ? 'checkin' : (TELA || 'checkin'));
}
function montarNav(){
  const itens = S.papel === 'admin'
    ? [['checkin','◉','Portaria'],['eventos','▤','Eventos'],['lista','☰','Lista'],['painel','◈','Painel']]
    : [['checkin','◉','Portaria'],['lista','☰','Lista']];
  $('#nav').classList.remove('oculto');
  $('#nav').innerHTML = itens.map(([k,ic,l]) =>
    '<button class="' + (TELA===k?'on':'') + '" onclick="ir(\'' + k + '\')">' +
    '<span class="ic">' + ic + '</span>' + l + '</button>').join('');
}
function ir(t){
  TELA = t;
  montarNav();
  ({ checkin: telaCheckin, eventos: telaEventos, lista: telaLista, painel: telaPainel })[t]();
}

/* ============================================================
   CHECK-IN
   ============================================================ */
function telaCheckin(){
  if (!EV_SEL){ escolherEventoCheckin(); return; }

  const c = CACHE[EV_SEL];
  if (!c){ $('#corpo').innerHTML = '<div class="spin"></div>'; carregarEvento(EV_SEL).then(() => ir('checkin')); return; }

  const conf = c.convidados.filter(x => x.rsvp === 'confirmado');
  const pres = c.convidados.filter(x => x.checkin_em);
  const pessoasEsp = conf.reduce((s,x) => s + 1 + (x.acompanhantes||0), 0);
  const pessoasPres = pres.reduce((s,x) => s + 1 + (x.acompanhantes||0), 0);

  $('#corpo').innerHTML =
    '<div class="card" style="padding:14px 16px">' +
      '<h3 style="margin-bottom:6px">Evento na portaria</h3>' +
      '<div style="font-family:Georgia,serif;font-size:17px;color:var(--navy)">' + esc(c.evento.nome) + '</div>' +
      '<div style="font-size:12.5px;color:var(--muted);margin-top:3px">' + dataBR(c.evento.data) + ' · ' + esc(c.evento.local || 'Luare Eventos') + '</div>' +
      '<div class="space"></div>' +
      '<button class="btn g sm" onclick="escolherEventoCheckin()">Trocar evento</button>' +
    '</div>' +

    '<div class="kpis">' +
      '<div class="kpi"><div class="l">Já entraram</div><div class="v">' + pessoasPres + '</div><div class="s">' + pres.length + ' ingressos</div></div>' +
      '<div class="kpi"><div class="l">Esperados</div><div class="v">' + pessoasEsp + '</div><div class="s">' + conf.length + ' confirmados</div></div>' +
    '</div>' +

    '<button class="btn p" style="padding:19px;font-size:16.5px;margin-bottom:12px" onclick="abrirLeitor()">' +
      '⛶ Ler QR code</button>' +

    '<div class="card">' +
      '<h3>Buscar convidado <span class="badge">manual</span></h3>' +
      '<input id="busca" placeholder="Digite o nome..." oninput="buscarConv()" autocomplete="off">' +
      '<div id="resBusca" style="margin-top:8px"></div>' +
    '</div>';

  const b = $('#busca');
  if (b) b.addEventListener('keydown', e => { if(e.key === 'Enter') buscarConv(true); });

  processarFila();
}

function buscarConv(enter){
  const q = ($('#busca').value || '').trim().toLowerCase();
  const box = $('#resBusca');
  if (!EV_SEL || !CACHE[EV_SEL]){ box.innerHTML = ''; return; }
  const conf = CACHE[EV_SEL].convidados.filter(x => x.rsvp === 'confirmado');
  if (!q){ box.innerHTML = ''; return; }

  const achou = conf.filter(x => x.nome.toLowerCase().includes(q)).slice(0, 8);
  if (!achou.length){
    box.innerHTML = '<p class="sub" style="margin:8px 0 0">Nenhum confirmado com esse nome.</p>';
    return;
  }
  if (enter && achou.length === 1){ confirmarManual(achou[0].id); return; }

  box.innerHTML = achou.map(x =>
    '<div class="item" onclick="confirmarManual(\'' + x.id + '\')">' +
      '<div class="av">' + esc(x.nome.trim()[0] || '?') + '</div>' +
      '<div class="tx"><b>' + esc(x.nome) + '</b>' +
        '<span>' + (1+(x.acompanhantes||0)) + ' pessoa' + ((1+(x.acompanhantes||0))>1?'s':'') +
        ' · Mesa ' + esc(x.mesa || '—') + '</span></div>' +
      '<div class="vl">' + (x.checkin_em ? '<span class="tg n">entrou</span>' : '<span class="tg ok">entrar</span>') + '</div>' +
    '</div>').join('');
}

/* ---------- LEITOR DE QR ---------- */
let stream = null, rafId = null, ultimoLido = '', ultimoTs = 0;

function abrirLeitor(){
  const d = document.createElement('div');
  d.className = 'leitor';
  d.id = 'leitor';
  d.innerHTML =
    '<video id="vid" playsinline muted></video>' +
    '<div class="mira"></div>' +
    '<div class="bar">' +
      '<p>Aponte para o QR code do convidado</p>' +
      '<button class="btn g sm" onclick="fecharLeitor()">Cancelar</button>' +
    '</div>';
  document.body.appendChild(d);

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(s => {
    stream = s;
    const v = $('#vid');
    v.srcObject = s;
    v.setAttribute('playsinline', 'true');
    return v.play();
  }).then(() => { loopLeitura(); })
  .catch(() => {
    fecharLeitor();
    toast('Não foi possível abrir a câmera. Use a busca por nome.', 'erro');
  });
}

function loopLeitura(){
  const v = $('#vid');
  if (!v || !stream) return;
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth || 640;
  cv.height = v.videoHeight || 480;
  const cx = cv.getContext('2d');

  const passo = () => {
    if (!stream) return;
    if (v.readyState === v.HAVE_ENOUGH_DATA){
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      try{
        const img = cx.getImageData(0, 0, cv.width, cv.height);
        const code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data){
          const agora = Date.now();
          if (code.data !== ultimoLido || agora - ultimoTs > 3200){
            ultimoLido = code.data; ultimoTs = agora;
            const t = extrairToken(code.data);
            if (t){ fecharLeitor(); fazerCheckin(t); return; }
          }
        }
      }catch(e){}
    }
    rafId = requestAnimationFrame(passo);
  };
  passo();
}

function extrairToken(txt){
  const m = String(txt).match(/[?&]t=([^&\s]+)/);
  if (m) return decodeURIComponent(m[1]);
  const s = String(txt).trim();
  if (/^[a-f0-9]{24}$/i.test(s)) return s;
  return null;
}

function fecharLeitor(){
  const d = $('#leitor');
  if (d) d.remove();
  if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  ultimoLido = ''; ultimoTs = 0;
}

/* ---------- CHECK-IN ---------- */
function marcarNoCache(token, hora){
  for (const id in CACHE){
    const c = CACHE[id].convidados.find(x => x.token === token);
    if (c){
      if (!c.checkin_em) c.checkin_em = new Date().toISOString();
      salvarCache();
      return c;
    }
  }
  return null;
}

function fazerCheckin(token){
  const local = acharLocalPorToken(token);
  const semRede = () => {
    if (local){
      if (local.checkin_em){ mostrarResultado({ ok:false, ja_entrou:true, nome:local.nome, mesa:local.mesa },
        'Este ingresso já entrou.'); return; }
      if (local.rsvp !== 'confirmado'){
        mostrarResultado({ ok:false, nome:local.nome, erro:'Presença não confirmada (' + local.rsvp + ').' }); return;
      }
      local.checkin_em = new Date().toISOString();
      local.__pendente = true;
      salvarCache();
      enfileirar(local.token);
      mostrarResultado({ ok:true, nome:local.nome, acompanhantes:local.acompanhantes, mesa:local.mesa,
        hora: horaAgora() });
      return;
    }
    toast('Sem conexão e este ingresso não está no aparelho.', 'erro');
  };

  rpc('conv_checkin', { p_token: token, p_operador: S.nome })
    .then(r => {
      if (r && typeof r === 'object' && ('ok' in r)){
        if (r.ok) marcarNoCache(token);
        mostrarResultado(r);
      } else semRede();
    })
    .catch(semRede);
}

function horaAgora(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function acharLocalPorToken(t){
  for (const id in CACHE){
    const c = CACHE[id].convidados.find(x => x.token === t);
    if (c) return c;
  }
  return null;
}

function mostrarResultado(r, msgExtra){
  if (!r) return;
  const ok = r.ok === true;
  const cls = ok ? 'ok' : (r.ja_entrou ? 'warn' : 'bad');

  const pessoas = 1 + (r.acompanhantes || 0);
  let html = '';
  if (ok){
    html += '<h2>Entrada liberada</h2>';
    html += '<div class="nome">' + esc(r.nome) + '</div>';
    html += '<div class="det">' + pessoas + (pessoas > 1 ? ' pessoas' : ' pessoa') +
            (r.acompanhantes ? ' (convidado + ' + r.acompanhantes + ')' : '') + '</div>';
    if (r.mesa){
      html += '<div class="mesa-big">' + esc(r.mesa) + '</div><div class="mesa-l">Mesa</div>';
    } else {
      html += '<div class="det" style="margin-top:10px">Mesa não definida</div>';
    }
    html += '<div class="det" style="margin-top:12px;opacity:.8">Entrada às ' + esc(r.hora || horaAgora()) + '</div>';
  } else {
    html += '<h2>' + (r.ja_entrou ? 'Já entrou' : 'Atenção') + '</h2>';
    if (r.nome) html += '<div class="nome">' + esc(r.nome) + '</div>';
    html += '<div class="det">' + esc(msgExtra || r.erro || 'Não foi possível liberar.') + '</div>';
    if (r.mesa) html += '<div class="det" style="margin-top:8px">Mesa ' + esc(r.mesa) + '</div>';
  }

  const div = document.createElement('div');
  div.className = 'resultado ' + cls;
  div.innerHTML = html + '<div class="acoes"><button onclick="this.closest(\'.resultado\').remove()">Fechar</button></div>';
  document.body.appendChild(div);
  setTimeout(() => { if (div.parentNode) div.remove(); }, 7000);

  // some da tela de check-in para atualizar contadores
  if (ok || r.ja_entrou) setTimeout(() => { if (EV_SEL) ir('checkin'); }, 900);
}

function confirmarManual(id){
  const c = CACHE[EV_SEL].convidados.find(x => x.id === id);
  if (!c) return;
  if (c.checkin_em){ mostrarResultado({ ok:false, ja_entrou:true, nome:c.nome, mesa:c.mesa }, 'Este ingresso já entrou.'); return; }
  fazerCheckin(c.token);
}

/* ---------- FILA OFFLINE ---------- */
function enfileirar(token){
  let f = [];
  try{ f = JSON.parse(localStorage.getItem(LS_FILA) || '[]'); }catch(e){}
  if (!f.includes(token)) f.push(token);
  try{ localStorage.setItem(LS_FILA, JSON.stringify(f)); }catch(e){}
  atualizarAvisoSync();
  clearTimeout(syncTimer);
  syncTimer = setTimeout(processarFila, 4000);
}

function processarFila(){
  let f = [];
  try{ f = JSON.parse(localStorage.getItem(LS_FILA) || '[]'); }catch(e){}
  if (!f.length){ atualizarAvisoSync(); return; }
  const t = f[0];
  rpc('conv_checkin', { p_token: t, p_operador: S.nome })
    .then(() => {
      const resto = f.slice(1);
      try{ localStorage.setItem(LS_FILA, JSON.stringify(resto)); }catch(e){}
      atualizarAvisoSync();
      if (resto.length) setTimeout(processarFila, 700);
    })
    .catch(() => { atualizarAvisoSync(); });
}

function atualizarAvisoSync(){
  let f = [];
  try{ f = JSON.parse(localStorage.getItem(LS_FILA) || '[]'); }catch(e){}
  let a = $('#avisoSync');
  if (!f.length){ if (a) a.remove(); return; }
  if (!a){
    a = document.createElement('div');
    a.className = 'sync'; a.id = 'avisoSync';
    document.body.appendChild(a);
  }
  a.textContent = '⟳ ' + f.length + ' entrada(s) aguardando sincronizar';
}

/* ============================================================
   CARREGAR EVENTO (com cache offline)
   ============================================================ */
function carregarEvento(id){
  return Promise.all([
    rpc('conv_admin', { p_pin:S.pin, p_acao:'convidados', p_dados:{ evento_id:id } }),
    rpc('conv_admin', { p_pin:S.pin, p_acao:'eventos', p_dados:{} })
  ]).then(([rc, re]) => {
    if (rc && rc.ok && re && re.ok){
      const ev = (re.dados || []).find(x => x.id === id);
      CACHE[id] = { convidados: rc.dados || [], evento: ev || { nome:'Evento', data:null }, ts: Date.now() };
      salvarCache();
      return CACHE[id];
    }
    if (CACHE[id]) return CACHE[id];
    return { convidados: [], evento:{ nome:'Evento', data:null } };
  }).catch(() => CACHE[id] || { convidados: [], evento:{ nome:'Evento', data:null } });
}

   ============================================================ */
function escolherEventoCheckin(){
  $('#corpo').innerHTML = '<div class="spin"></div>';
  rpc('conv_admin', { p_pin:S.pin, p_acao:'eventos', p_dados:{} }).then(r => {
    if (!r || !r.ok){ $('#corpo').innerHTML = '<div class="vazio">Sessão expirada. Saia e entre de novo.</div>'; return; }
    const hoje = new Date().toISOString().slice(0,10);
    const evs = (r.dados || []).filter(e => e.status !== 'cancelado');
    const prox = evs.filter(e => e.data >= hoje).sort((a,b) => a.data.localeCompare(b.data));
    const ant  = evs.filter(e => e.data < hoje).sort((a,b) => b.data.localeCompare(a.data)).slice(0,6);

    const linha = e =>
      '<div class="item" onclick="selecionarEvento(\'' + e.id + '\')">' +
        '<div class="av">' + diaAbrev(e.data) + '</div>' +
        '<div class="tx"><b>' + esc(e.nome) + '</b>' +
          '<span>' + dataBR(e.data) + ' · ' + e.confirmados + '/' + e.total + ' confirmados</span></div>' +
        '<div class="vl">' + (e.presentes ? '<span class="tg ok">' + e.presentes + ' entraram</span>' : '<span class="tg n">abrir</span>') + '</div>' +
      '</div>';

    $('#corpo').innerHTML =
      '<div class="card"><h3>Escolha o evento</h3>' +
        (prox.length ? prox.map(linha).join('') : '<div class="vazio" style="padding:20px">Nenhum evento futuro.</div>') +
      '</div>' +
      (ant.length ? '<div class="card"><h3>Anteriores</h3>' + ant.map(linha).join('') + '</div>' : '') +
      '<p class="sub" style="text-align:center;font-size:12px">Toque no evento da noite para abrir a portaria.</p>';
  }).catch(() => {
    $('#corpo').innerHTML = '<div class="vazio">Sem conexão.<br>Conecte-se uma vez antes da festa para baixar a lista.</div>';
  });
}

function executarImportacao(evId){

  const linhas = txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(';').map(s => (s || '').trim());
    return { nome: p[0], telefone: p[1] || null, mesa: p[2] || null, acompanhantes: parseInt(p[3], 10) || 0 };

  $('#corpo').innerHTML = '<div class="spin"></div>';

function definirMesas(evId){
  const c = CACHE[evId];
  const conf = c.convidados.filter(x => x.rsvp === 'confirmado');
  if (!conf.length){ toast('Ninguém confirmado ainda — o mapa sai dos confirmados.', 'erro'); return; }
  const POR_MESA = 9;
  const grupos = [];
  let atual = [], ocup = 0;
  conf.forEach(x => {
    const n = 1 + (x.acompanhantes || 0);
    if (ocup + n > POR_MESA && atual.length){ grupos.push(atual); atual = []; ocup = 0; }
    atual.push(x); ocup += n;
  });
  if (atual.length) grupos.push(atual);

  const atrib = [];
  grupos.forEach((g, i) => g.forEach(x => atrib.push({ id: x.id, mesa: String(i + 1) })));

  rpc('conv_admin', { p_pin:S.pin, p_acao:'mesas', p_dados:{ evento_id: evId, atribuicoes: atrib } })
    .then(r => {
      if (!r || !r.ok){ toast('Não gravou.', 'erro'); return; }
      toast(grupos.length + ' mesas organizadas.');
      carregarEvento(evId).then(() => telaEventoAdmin(evId));
    }).catch(() => toast('Sem conexão.', 'erro'));
}

  const c = CACHE[EV_SEL];
  if (!c){ $('#corpo').innerHTML = '<div class="spin"></div>'; carregarEvento(EV_SEL).then(() => ir('lista')); return; }
  const conf = c.convidados.filter(x => x.rsvp === 'confirmado');

  $('#corpo').innerHTML =
    '<h1>Lista de confirmados</h1>' +
    '<p class="sub">' + esc(c.evento.nome) + ' · ' + dataBR(c.evento.data) + '</p>' +
    '<div class="card">' +
      (conf.length ? conf.map(x =>
        '<div class="item" onclick="confirmarManual(\'' + x.id + '\')">' +
          '<div class="av">' + esc(x.nome.trim()[0] || '?') + '</div>' +
          '<div class="tx"><b>' + esc(x.nome) + '</b>' +
            '<span>' + (1+(x.acompanhantes||0)) + ' pessoa' + ((1+(x.acompanhantes||0))>1?'s':'') +
            ' · Mesa ' + esc(x.mesa || '—') + '</span></div>' +
          '<div class="vl">' + (x.checkin_em ? '<span class="tg n">entrou</span>' : '<span class="tg ok">✓</span>') + '</div>' +
        '</div>').join('')
        : '<div class="vazio">Nenhum confirmado.</div>') +
    '</div>';
}

/* ============================================================
   PAINEL (admin)
   ============================================================ */
function telaPainel(){
  if (!EV_SEL){ escolherEventoCheckin(); return; }
  const c = CACHE[EV_SEL];
  if (!c){ $('#corpo').innerHTML = '<div class="spin"></div>'; carregarEvento(EV_SEL).then(() => ir('painel')); return; }

  // recarrega em segundo plano para o painel não ficar preso no cache
  carregarEvento(EV_SEL).then(() => { if (TELA === 'painel') desenharPainel(); });
  desenharPainel(c);
}

function desenharPainel(){
  const c = CACHE[EV_SEL];
  if (!c) return;

  const conf = c.convidados.filter(x => x.rsvp === 'confirmado');
  const pres = c.convidados.filter(x => x.checkin_em);
  const pessoasEsp = conf.reduce((s,x) => s + 1 + (x.acompanhantes||0), 0);
  const pessoasPres = pres.reduce((s,x) => s + 1 + (x.acompanhantes||0), 0);
  const pct = pessoasEsp ? Math.round(pessoasPres / pessoasEsp * 100) : 0;

  const mesas = {};
  conf.forEach(x => {
    const m = x.mesa || 'sem';
    mesas[m] = mesas[m] || { pessoas:0 };
    mesas[m].pessoas += 1 + (x.acompanhantes||0);
  });
  const ordemMesas = Object.keys(mesas).sort((a,b) =>
    a === 'sem' ? 1 : b === 'sem' ? -1 : (+a || 99) - (+b || 99));

  $('#corpo').innerHTML =
    '<h1>' + esc(c.evento.nome) + '</h1>' +
    '<p class="sub">' + dataBR(c.evento.data) + ' · ' + esc(c.evento.local || '') + '</p>' +

    '<div class="card">' +
      '<h3>Presença <span class="badge">' + pct + '%</span></h3>' +
      '<div style="font-family:Georgia,serif;font-size:34px;color:var(--navy);line-height:1">' +
        pessoasPres + ' <span style="font-size:17px;color:var(--muted)">de ' + pessoasEsp + '</span></div>' +
      '<div style="height:9px;background:var(--cream);border-radius:20px;margin-top:12px;overflow:hidden">' +
        '<div style="height:100%;width:' + pct + '%;background:var(--ok);border-radius:20px"></div></div>' +
    '</div>' +

    '<div class="card"><h3>Mesas <span class="badge">' + ordemMesas.length + '</span></h3>' +
      (ordemMesas.length ? ordemMesas.map(m =>
        '<div class="item" style="cursor:default">' +
          '<div class="av">' + (m === 'sem' ? '—' : m) + '</div>' +
          '<div class="tx"><b>' + (m === 'sem' ? 'Sem mesa definida' : 'Mesa ' + m) + '</b>' +
            '<span>' + mesas[m].pessoas + ' pessoa' + (mesas[m].pessoas>1?'s':'') + '</span></div>' +
          '<div class="vl">' + (m === 'sem' ? '<span class="tg w">definir</span>' : '') + '</div>' +
        '</div>').join('')
        : '<div class="vazio">Sem confirmados.</div>') +
    '</div>' +

    '<div class="card"><h3>Últimas entradas <span class="badge">' + pres.length + '</span></h3>' +
      (pres.length ? pres.slice().sort((a,b) => String(b.checkin_em).localeCompare(String(a.checkin_em))).slice(0,12).map(x =>
        '<div class="item" style="cursor:default">' +
          '<div class="av">' + esc(x.nome.trim()[0] || '?') + '</div>' +
          '<div class="tx"><b>' + esc(x.nome) + '</b><span>Mesa ' + esc(x.mesa || '—') + '</span></div>' +
          '<div class="vl">' + new Date(x.checkin_em).toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'}) + '</div>' +
        '</div>').join('')
        : '<div class="vazio">Ninguém entrou ainda.</div>') +
    '</div>';
}

/* ============================================================
   INÍCIO
   ============================================================ */
carregarCache();
try{ S.pin = localStorage.getItem(LS_PIN); }catch(e){}
if (S.pin){
  $('#corpo').innerHTML = '<div class="spin"></div>';
  rpc('conv_login', { p_pin: S.pin }).then(r => {
    if (r && r.ok){
      S.nome = r.nome; S.papel = r.papel;
      iniciar();
      atualizarAvisoSync();
      setTimeout(processarFila, 1500);
    } else { telaLogin(); }
  }).catch(() => telaLogin());
} else {
  telaLogin();
}
</script>
